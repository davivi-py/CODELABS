<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONG CodeLab - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo">
    <div class="logo">ONG <span class="destaque">CODELAB</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="adocao.html">Adote</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <main>
    <h1>ÁREA DA ONG</h1>

    <form id="form-login" class="form-contato"> <!-- formulário de login -->
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required> <!-- input: campos de entrada -->
    <!-- type:"email" sem @ ou domínio o envio é impedido -->
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required> <!-- atributo required: não deixa ser enviado em branco -->

      <button type="submit" id="btn-login">ENTRAR</button>
    </form>

    <p id="msg-status" class="msg-status"></p>
  </main>

  <footer class="rodape"></footer>

  <script type="module" src="js/login.js"></script> <!-- integração com o javascript -->
</body>
</html>
